<title>OpenWorld2003</title>
<meta name="description" content="Cuánto queda para que Digimon World 3 sea un juego de PC de verdad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap">

<style>
/* ── OpenWorld2003 ────────────────────────────────────────────────────────
   Pantalla de menu. El suelo de teselas es teselas.png, arte propio del
   usuario. Ningun recurso del juego entra aqui. */

:root{
  --negro:#04070F;
  --caja:#070C22; --borde:#2F6BEE; --borde-2:#1A3E8C;
  --blanco:#FFFFFF; --gris:#9FB6D8;
  --oro:#F2C94C; --verde:#5BE39C; --cian:#5FDCFF;
  --linea:#1E4AA8;
  --tinta:#16255C;
  --pixel:"Press Start 2P",monospace;
}
html[lang="ja"]{ --pixel:"Noto Sans JP",system-ui,sans-serif }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--blanco);background:var(--negro);
  font-family:Silkscreen,ui-monospace,monospace;
  font-size:16px;line-height:1.7;
  display:flex;flex-direction:column;align-items:center;
  padding:clamp(16px,4vw,44px) 16px 40px;
  position:relative;isolation:isolate;
}
html[lang="ja"] body{font-family:"Noto Sans JP",system-ui,sans-serif}

/* el mosaico: tus teselas, fijas, con una veladura para que se lea el texto */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:var(--negro) url("teselas.png") 0 0 repeat;
  background-size:288px 288px;
  image-rendering:pixelated;
  animation:mosaico 90s linear infinite;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(4,7,15,.35), rgba(4,7,15,.88) 70%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px);
}
@keyframes mosaico{ to{ background-position:288px 576px } }

::selection{background:var(--borde);color:#fff}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

/* ── barra de arriba ──────────────────────────────────────────────────── */
.arriba{
  width:100%;max-width:760px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-bottom:clamp(14px,3vw,26px);
}
h1{
  font-family:var(--pixel);font-size:clamp(11px,2.2vw,16px);
  margin:0;line-height:1.5;letter-spacing:.02em;text-shadow:0 2px 0 #000;
}
h1 b{font-weight:400;display:block;font-size:.72em;margin-top:6px;color:var(--gris)}
.chapa{
  font-family:var(--pixel);font-size:11px;color:var(--oro);
  border:2px solid var(--oro);background:rgba(4,7,15,.85);
  padding:9px 11px;white-space:nowrap;line-height:1;
}

/* ── idiomas ──────────────────────────────────────────────────────────── */
.idiomas{
  width:100%;max-width:760px;display:flex;gap:6px;flex-wrap:wrap;
  margin-bottom:clamp(12px,2.4vw,18px);
}
.idiomas button{
  font-family:var(--pixel);font-size:10px;line-height:1;
  color:var(--gris);background:rgba(7,12,34,.82);
  border:2px solid var(--borde-2);padding:8px 9px;cursor:pointer;
  transition:color .1s steps(2),border-color .1s steps(2),transform .1s steps(2);
}
.idiomas button:hover{color:var(--cian);border-color:var(--borde);transform:translateY(-2px)}
.idiomas button[aria-pressed="true"]{color:var(--negro);background:var(--cian);border-color:var(--cian)}

/* ── el cuadro ────────────────────────────────────────────────────────── */
.cuadro{
  width:100%;max-width:760px;background:rgba(7,12,34,.92);
  border:3px solid var(--borde);border-radius:12px;
  padding:14px 10px;box-shadow:0 0 0 3px #000, 0 10px 0 rgba(0,0,0,.35);
}
.cuadro + .cuadro{margin-top:clamp(14px,3vw,22px)}

.titulo{
  font-family:var(--pixel);font-size:11px;color:var(--gris);
  padding:2px 12px 12px;letter-spacing:.06em;
}

/* filas del menu */
.fila{
  width:100%;display:flex;align-items:center;gap:12px;
  background:none;border:0;border-bottom:1px solid var(--linea);
  color:var(--blanco);font:inherit;cursor:pointer;text-align:left;
  padding:13px 12px 12px 34px;position:relative;
  font-family:var(--pixel);font-size:clamp(10px,1.8vw,13px);
  letter-spacing:.04em;line-height:1.4;
  transition:color .1s steps(2),background .1s steps(2);
}
.fila:last-child{border-bottom:0}
.fila .flecha{
  position:absolute;left:11px;top:50%;width:0;height:0;
  border-left:11px solid var(--blanco);
  border-top:7px solid transparent;border-bottom:7px solid transparent;
  transform:translateY(-50%) scaleX(0);transform-origin:left center;
  transition:transform .12s steps(3);
}
.fila:hover,.fila:focus-visible,.fila.sel{color:var(--cian);background:rgba(47,107,238,.10)}
.fila:hover .flecha,.fila:focus-visible .flecha,.fila.sel .flecha{transform:translateY(-50%) scaleX(1)}
.fila .nom{flex:1}
.fila .val{color:var(--oro);font-size:.85em;white-space:nowrap}
.fila.hecho .val{color:var(--verde)}
/* la fila abierta se queda marcada mientras habla */
.fila.hablando{color:var(--cian);background:rgba(47,107,238,.16);border-bottom-color:transparent}

/* ── el cuadro de dialogo: tal como sale en el juego ──────────────────── */
.dialogo{
  display:none;position:relative;
  width:auto;
  margin:16px 6px 14px;
  padding:22px 20px 34px;
  color:var(--tinta);
  background:linear-gradient(180deg,#F4F9FF 0%,#DCE9FB 46%,#BFD5F2 100%);
  border:2px solid var(--tinta);
  border-radius:4px;
  box-shadow:
    inset 0 0 0 2px #FFFFFF,
    inset 0 0 0 4px #8FB2E0,
    0 0 0 2px #000,
    0 8px 0 rgba(0,0,0,.45);
}
.dialogo.abierto{display:block;animation:abre .16s steps(4)}
@keyframes abre{
  from{transform:scaleY(.15);opacity:.3}
  to{transform:scaleY(1);opacity:1}
}
/* la pestaña con el nombre, encajada en el borde de arriba */
.dialogo .quien{
  position:absolute;top:-13px;left:16px;
  font-family:var(--pixel);font-size:10px;line-height:1;
  color:#1B3E8C;background:#F7FBFF;
  border:2px solid var(--tinta);border-radius:3px;
  padding:6px 9px;letter-spacing:.05em;
  box-shadow:0 0 0 2px #000;
  max-width:calc(100% - 32px);
}
.dialogo p{margin:0;font-size:15px;color:var(--tinta);max-width:60ch}
.dialogo p + p{margin-top:11px}
.dialogo b{color:#0C57C4;font-weight:700}
/* la flechita naranja de "sigue", abajo a la derecha */
.dialogo .sigue{
  position:absolute;right:14px;bottom:12px;width:0;height:0;
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:10px solid #E8791F;
  filter:drop-shadow(0 1px 0 #7A3300);
  animation:late .8s steps(1) infinite;
}
@keyframes late{ 50%{opacity:0} }

.medida{
  margin:16px 0 2px;display:flex;align-items:center;gap:10px;
  font-family:var(--pixel);font-size:10px;color:#33528F;
}
.tiras{display:flex;gap:3px;flex:1}
.tiras i{flex:1;height:12px;background:#AEC4E4;border:1px solid #33528F}
.tiras i.on{background:#1B6FE0;border-color:#0C3B85}
.tiras i.on.ok{background:#17A05E;border-color:#0A5231}
.cerrar{
  margin:14px 0 0;font-family:var(--pixel);font-size:10px;
  color:#33528F;background:none;border:0;cursor:pointer;padding:6px 0;
}
.cerrar:hover{color:#0C57C4;text-decoration:underline}

/* ── pantalla de idioma: la primera, como en el juego ─────────────────── */
#entrada{
  position:fixed;inset:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(16px,3vw,26px);padding:28px 20px;text-align:center;
  background:rgba(4,7,15,.94);
  transition:opacity .4s ease, visibility .4s;
}
#entrada.fuera{opacity:0;visibility:hidden}
#entrada .marca{
  font-family:var(--pixel);font-size:clamp(13px,3.4vw,22px);color:var(--cian);
  text-shadow:0 3px 0 #000;letter-spacing:.04em;
  opacity:0;animation:entra .5s ease .1s forwards;
}
#entrada .rotulo{
  font-family:var(--pixel);font-size:11px;color:var(--gris);letter-spacing:.12em;
  opacity:0;animation:entra .4s ease .5s forwards;
}
.banderas{
  display:grid;gap:10px;width:100%;max-width:640px;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
}
.banderas button{
  display:flex;align-items:center;gap:11px;
  background:rgba(7,12,34,.9);border:2px solid var(--borde-2);
  color:var(--blanco);font-family:var(--pixel);font-size:10px;line-height:1.4;
  padding:11px 12px;cursor:pointer;text-align:left;
  opacity:0;animation:entra .35s ease forwards;
  transition:border-color .1s steps(2),background .1s steps(2),transform .1s steps(2);
}
.banderas button:nth-child(1){animation-delay:.75s}
.banderas button:nth-child(2){animation-delay:.85s}
.banderas button:nth-child(3){animation-delay:.95s}
.banderas button:nth-child(4){animation-delay:1.05s}
.banderas button:nth-child(5){animation-delay:1.15s}
.banderas button:nth-child(6){animation-delay:1.25s}
.banderas button:nth-child(7){animation-delay:1.35s}
.banderas button:hover,.banderas button:focus-visible{
  border-color:var(--cian);background:rgba(47,107,238,.18);transform:translateY(-2px);
}
.banderas svg{
  width:36px;height:24px;flex:none;display:block;
  border:2px solid #000;box-shadow:0 0 0 1px #4A6FA8;
}
@media (prefers-reduced-motion:reduce){
  #entrada .marca,#entrada .rotulo,.banderas button{opacity:1;animation:none}
}

/* ── pantalla de entrada: el aviso legal ──────────────────────────────── */
#aviso{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:28px 22px;text-align:center;
  background:rgba(4,7,15,.94);
  transition:opacity .5s ease, visibility .5s;
}
#aviso.fuera{opacity:0;visibility:hidden}
#aviso .marca{
  font-family:var(--pixel);font-size:clamp(13px,3.4vw,22px);color:var(--cian);
  text-shadow:0 3px 0 #000;letter-spacing:.04em;
  opacity:0;animation:entra .5s ease .1s forwards;
}
#aviso p{
  margin:0;max-width:54ch;font-size:clamp(13px,2.4vw,15px);
  color:var(--gris);line-height:1.75;
  opacity:0;animation:entra .5s ease forwards;
}
#aviso p:nth-of-type(1){animation-delay:.5s}
#aviso p:nth-of-type(2){animation-delay:.9s}
#aviso p:nth-of-type(3){animation-delay:1.3s}
#aviso p:nth-of-type(4){animation-delay:1.7s;color:#C8D8F2}
#aviso .raya{
  width:min(320px,70%);height:2px;background:var(--borde-2);
  opacity:0;animation:entra .4s ease 2.1s forwards;
}
#aviso button{
  font-family:var(--pixel);font-size:11px;line-height:1;
  color:var(--negro);background:var(--oro);border:2px solid #000;
  padding:12px 16px;cursor:pointer;
  opacity:0;animation:entra .4s ease 2.4s forwards, pulso 1.4s steps(2) 2.8s infinite;
}
#aviso button:hover{background:#FFE38A}
@keyframes entra{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes pulso{ 50%{transform:translateY(-3px)} }
@media (prefers-reduced-motion:reduce){
  #aviso .marca,#aviso p,#aviso .raya,#aviso button{opacity:1;animation:none}
}

footer{
  max-width:760px;margin-top:clamp(18px,3vw,28px);
  font-size:13px;color:var(--gris);text-align:center;line-height:1.8;
}
footer a{color:var(--oro)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

(function(){
  var menu = document.getElementById("menu");
  var dial = document.getElementById("dialogo");
  var barra = document.getElementById("idiomas");
  var aviso = document.getElementById("aviso");
  var entrada = document.getElementById("entrada");
  var rejilla = document.getElementById("banderas");
  var pantalla = "sistemas", sel = 0, idi = "es", abierto = null;

  /* si el navegador esta en uno de los idiomas del juego, se abre en ese */
  var nav = (navigator.language || "es").slice(0,2).toLowerCase();
  for (var k = 0; k < IDIOMAS.length; k++) if (IDIOMAS[k].id === nav) idi = nav;

  function tt(){ return T[idi]; }

  function filas(){
    var t = tt();
    if (pantalla === "sistemas")
      return CIFRAS.map(function(s){
        var p = Math.round(s.h / s.d * 100), x = t.s[s.c];
        return {n:x.n, val:(s.ok ? "100%" : p + "%"), ok:s.ok, txt:x.t, h:s.h, d:s.d};
      }).concat([{n:t.verDudas, val:"▸", ir:"dudas"}]);
    return CLAVES_DUDA.map(function(c){
      var x = t.d[c]; return {n:x.n, val:"", txt:x.t};
    }).concat([{n:t.volver, val:"◂", ir:"sistemas"}]);
  }

  function pinta(){
    var t = tt();
    if (dial.parentNode === menu) document.body.appendChild(dial);
    menu.innerHTML = '<div class="titulo">' +
      (pantalla === "sistemas" ? t.partes : t.dudas) + '</div>';
    filas().forEach(function(x, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "fila" + (x.ok ? " hecho" : "") + (i === sel ? " sel" : "");
      b.innerHTML = '<span class="flecha" aria-hidden="true"></span>' +
        '<span class="nom"></span><span class="val"></span>';
      b.querySelector(".nom").textContent = x.n;
      b.querySelector(".val").textContent = x.val;
      b.addEventListener("mouseenter", function(){ sel = i; marca(); });
      b.addEventListener("focus", function(){ sel = i; marca(); });
      b.addEventListener("click", function(){ sel = i; elige(); });
      menu.appendChild(b);
    });
  }

  function marca(){
    var b = menu.querySelectorAll(".fila");
    for (var i = 0; i < b.length; i++) b[i].classList.toggle("sel", i === sel);
  }

  function elige(){
    var x = filas()[sel];
    if (x.ir){ pantalla = x.ir; sel = 0; cierra(); pinta(); return; }
    /* si ya estaba abierta esa misma fila, se cierra */
    if (abierto && abierto.p === pantalla && abierto.i === sel){ cierra(); return; }
    cierra();
    abierto = {p:pantalla, i:sel};
    abre(x);
  }

  function abre(x){
    var t = tt(), html = '<div class="quien">' + x.n + '</div>';
    html += x.txt.map(function(s){ return "<p>" + s + "</p>"; }).join("");
    if (x.d){
      var p = Math.round(x.h / x.d * 100), n = Math.max(1, Math.round(p / 100 * 16)), s = "";
      for (var i = 0; i < 16; i++)
        s += '<i class="' + (i < n ? "on" + (x.ok ? " ok" : "") : "") + '"></i>';
      html += '<div class="medida"><span>' + (x.ok ? t.completo : x.h + " / " + x.d) +
              '</span><span class="tiras">' + s + '</span></div>';
    }
    html += '<button class="cerrar" type="button">▸ ' + t.cerrar + '</button>';
    html += '<span class="sigue" aria-hidden="true"></span>';
    dial.innerHTML = html;
    var b = menu.querySelectorAll(".fila")[sel];
    if (b){
      b.classList.add("hablando");
      b.insertAdjacentElement("afterend", dial);
    }
    dial.classList.add("abierto");
    dial.querySelector(".cerrar").addEventListener("click", cierra);
  }

  function cierra(){
    abierto = null;
    dial.classList.remove("abierto");
    dial.innerHTML = "";
    var m = menu.querySelector(".fila.hablando");
    if (m) m.classList.remove("hablando");
    document.body.appendChild(dial);
  }

  function pintaIdiomas(){
    barra.setAttribute("aria-label", tt().idioma);
    barra.innerHTML = "";
    IDIOMAS.forEach(function(l){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = l.et;
      b.setAttribute("aria-pressed", l.id === idi ? "true" : "false");
      b.setAttribute("lang", l.lang);
      b.addEventListener("click", function(){ cambia(l.id); });
      barra.appendChild(b);
    });
  }

  function cambia(nuevo){
    idi = nuevo;
    document.documentElement.lang = nuevo;
    var t = tt();
    document.getElementById("sub").textContent = t.sub;
    document.getElementById("pie").textContent = t.pie;
    document.getElementById("enlace").textContent = t.enlace;
    var pa = aviso.querySelectorAll("p");
    for (var j = 0; j < pa.length; j++) pa[j].textContent = t.aviso[j] || "";
    aviso.querySelector("button").textContent = t.entrar;
    pintaIdiomas();
    pinta();
    /* si habia un dialogo abierto, se vuelve a abrir en el idioma nuevo */
    if (abierto && abierto.p === pantalla){ sel = abierto.i; marca(); abre(filas()[sel]); }
  }

  document.addEventListener("keydown", function(e){
    /* mientras se elige idioma, el teclado no toca el menu de detras */
    if (!entrada.hasAttribute("hidden") && !entrada.classList.contains("fuera")) return;
    if (pasa()){ e.preventDefault(); return; }
    var n = filas().length;
    if (e.key === "ArrowDown"){ sel = (sel + 1) % n; marca(); e.preventDefault(); }
    else if (e.key === "ArrowUp"){ sel = (sel + n - 1) % n; marca(); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === " "){
      if (document.activeElement && document.activeElement.classList.contains("fila")) return;
      elige(); e.preventDefault();
    }
    else if (e.key === "Escape") cierra();
  });

  function svgBandera(id){
    return '<svg viewBox="0 0 24 16" width="36" height="24" aria-hidden="true" ' +
           'xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">' +
           BANDERAS[id] + '</svg>';
  }

  function pintaEntrada(){
    rejilla.innerHTML = "";
    IDIOMAS.forEach(function(l){
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("lang", l.lang);
      b.innerHTML = svgBandera(l.id) + '<span class="nom"></span>';
      b.querySelector(".nom").textContent = NOMBRE_IDIOMA[l.id];
      b.addEventListener("click", function(){ eligeIdioma(l.id); });
      rejilla.appendChild(b);
    });
  }

  function eligeIdioma(id){
    cambia(id);
    entrada.classList.add("fuera");
    setTimeout(function(){ entrada.setAttribute("hidden", ""); }, 420);
    aviso.removeAttribute("hidden");   /* asi arrancan sus animaciones */
  }

  function pasa(){
    if (!entrada.hasAttribute("hidden") && !entrada.classList.contains("fuera")) return false;
    if (aviso.classList.contains("fuera")) return false;
    aviso.classList.add("fuera");
    setTimeout(function(){ aviso.setAttribute("hidden", ""); }, 520);
    return true;
  }
  aviso.addEventListener("click", pasa);
